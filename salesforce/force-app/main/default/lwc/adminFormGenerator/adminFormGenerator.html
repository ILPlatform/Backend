<template>
    <div class="container">
        <fieldset disabled={buttonClicked}>
            <lightning-input type="text" name="title" onchange={handleText} label="Form Title: Stages ILPlatform - "></lightning-input>
            <br />
            <div class="slds-grid slds-wrap">
                <template for:each={weekCodes} for:item="weekCode">
                    <div class="slds-col slds-size_1-of-4" key={weekCode.Week_Code__c}>
                        <lightning-input type="checkbox" name={weekCode.Week_Code__c} onchange={handleChecked} label={weekCode.Name}></lightning-input>
                    </div>
                </template>
            </div>
            <br />
            <button onclick={generateForm}>
                Generate Form
            </button>
        </fieldset>
        <br />
        <a lwc:dom="manual" class="link" href={link} target="_blank"></a>
    </div>
</template>

<template>
    <!-- Is modal is open, show login modal -->
    <template if:true={showLoginModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal header (title and close button) -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Log In</h2>
                </header>

                <!-- Text inputs (email and password) -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input type="email" label="Email" onchange={handleEmailChange}></lightning-input>
                    <lightning-input type="password" label="Password" onchange={handlePasswordChange}></lightning-input>
                    <div if:true={loginErrorMessage}>
                        <p style="color: red;">{loginErrorMessage}</p>
                    </div>
                </div>

                <!-- Cancel and confirm buttons -->
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleClose}></lightning-button>
                    <lightning-button variant="brand" label="Log In" onclick={login}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- If modal is closed, show login button -->
    <template if:false={showLoginModal}>
        <lightning-button label="Log In" onclick={openLoginModal}></lightning-button>
    </template>
</template>

name: Firebase Functions Deploy

on:
  push:
    branches:
    - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@master

      - name: Write secret files
        run: |
          printf '%s' "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" > functions/.firebase_adminsdk.json
          printf '%s' "${{ secrets.GOOGLEAPI_CREDENTIALS_JSON }}" > functions/.googleapi_credentials.json
          printf '%s' "${{ secrets.GOOGLEAPI_TOKEN_JSON }}" > functions/.googleapi_token.json
          chmod 600 functions/.firebase_adminsdk.json functions/.googleapi_credentials.json functions/.googleapi_token.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python venv for Functions
        working-directory: functions
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/functions/.firebase_adminsdk.json
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions --token "$FIREBASE_TOKEN"

name: Firebase Functions Deploy

on:
  push:
    branches:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@master

      - name: Write secret files
        run: |
          printf '%s' "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_B64 }}" | base64 --decode > functions/.firebase_adminsdk.json
          printf '%s' "${{ secrets.GOOGLEAPI_CREDENTIALS_JSON_B64 }}" | base64 --decode > functions/.googleapi_credentials.json
          printf '%s' "${{ secrets.GOOGLEAPI_TOKEN_JSON_B64 }}" | base64 --decode > functions/.googleapi_token.json
          chmod 600 functions/.firebase_adminsdk.json functions/.googleapi_credentials.json functions/.googleapi_token.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python venv for Functions
        working-directory: functions
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/functions/.firebase_adminsdk.json
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ github.workspace }}/functions/.firebase_adminsdk.json
          GOOGLE_CLOUD_PROJECT: ilplatform
          GCLOUD_PROJECT: ilplatform
          FIREBASE_PROJECT: ilplatform
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT"
